[package]
name = "loci-cache-lab"
version = "0.1.0"
edition = "2024"
description = "Reproducible conversation-cache scheduling experiments for llama.cpp"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
axum = "0.8"
